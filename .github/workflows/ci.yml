name: Offline verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: git diff --check
      - run: node scripts/check.mjs
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p test_laya_worker.py
      - run: node bin/pointsman.mjs smoke
      - run: node examples/fast-path.mjs
      - run: node examples/classifier-design.mjs
      - run: node examples/training-pipeline.mjs
      - name: No generated data or source changes
        run: test -z "$(git status --porcelain)"
